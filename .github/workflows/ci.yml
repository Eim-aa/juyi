name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check tests
      - name: Contract tests
        run: python -m pytest tests

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Report Xcode toolchain
        run: xcodebuild -version
      - name: Build Xcode Debug configuration
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiDebug"
          CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
      - name: Build Xcode Release configuration
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Release -derivedDataPath "$RUNNER_TEMP/JuyiRelease"
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify Xcode Release products
        run: |
          products="$RUNNER_TEMP/JuyiRelease/Build/Products/Release"
          scripts/verify_macos_binary.sh "$products/Juyi.app/Contents/MacOS/Juyi" 15.0
          if [ -e "$products/apple-translation-helper" ]; then exit 1; fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$products/Juyi.app/Contents/Info.plist")" = "$(scripts/read_xcconfig_value.sh Config/Version.xcconfig MARKETING_VERSION)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$products/Juyi.app/Contents/Info.plist")" = "$(scripts/read_xcconfig_value.sh Config/Version.xcconfig CURRENT_PROJECT_VERSION)"
      - name: Verify production native chain
        run: |
          for directory in "$RUNNER_TEMP/JuyiDebug/Build/Products/Debug/Juyi.app/Contents/MacOS" "$RUNNER_TEMP/JuyiRelease/Build/Products/Release/Juyi.app/Contents/MacOS"; do
            for token in 'NativeProductionTranslationCoordinator' 'NativeOptionMonitor' 'VolcTranslationEngine' 'translate.volcengineapi.com' 'LegacyComponentCleanup' 'io.github.Eim-aa.Juyi.native-translation-overlay'; do
              LC_ALL=C grep -aFq "$token" "$directory"/*
            done
            # Removed transport; tokens are split so repository greps stay empty.
            for token in 'NativeOwnerActivationCoordinator' 'owner-request''.json' '127.0.0.1:5432''1'; do
              if LC_ALL=C grep -aFq "$token" "$directory"/*; then exit 1; fi
            done
            find "$directory" -maxdepth 1 -type f -exec otool -L {} + > "$RUNNER_TEMP/native-production.loads"
            grep -Fq '/Translation.framework/' "$RUNNER_TEMP/native-production.loads"
            grep -Fq '/_Translation_SwiftUI.framework/' "$RUNNER_TEMP/native-production.loads"
            if grep -Fq '/Security.framework/' "$RUNNER_TEMP/native-production.loads"; then exit 1; fi
            if grep -Fq '/LocalAuthentication.framework/' "$RUNNER_TEMP/native-production.loads"; then exit 1; fi
          done
      - name: Build legacy universal native app bundle
        run: scripts/build_macos_app.sh
      - name: Run Swift tests
        run: scripts/run_swift_tests.sh "$RUNNER_TEMP/swift-tests"

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          shopt -s nullglob
          for script in scripts/*.sh scripts/*.command; do
            bash -n "$script"
          done
