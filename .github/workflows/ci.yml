name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest
      - name: Compile Python sources
        run: >-
          python -m compileall -q
          apple_engine.py config.py server.py translator.py volc_engine.py
          eval scripts tests

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Report Xcode toolchain
        run: xcodebuild -version
      - name: Verify native Volc source wiring
        run: |
          for source in NativeVolcDebugCredentialStore.swift NativeVolcDebugInterlock.swift NativeVolcDebugTransport.swift NativeVolcDebugWorkflow.swift NativeVolcTranslationAdapterModel.swift NativeVolcTranslationAdapterHost.swift; do
            grep -Fq "$source" Juyi.xcodeproj/project.pbxproj
            grep -Fq "$source" scripts/build_macos_app.sh
          done
          for source in NativeTranslationOverlayExternalPresentation.swift NativeTranslationResultLabPresentation.swift NativeTranslationResultLabModel.swift NativeTranslationResultLabHost.swift; do
            grep -Fq "$source" Juyi.xcodeproj/project.pbxproj
            grep -Fq "$source" scripts/build_macos_app.sh
          done
          for source in NativeTranslationAppleResultLabBindingPresentation.swift NativeTranslationAppleResultLabBindingModel.swift NativeTranslationAppleResultLabBindingHost.swift; do
            grep -Fq "$source" Juyi.xcodeproj/project.pbxproj
            grep -Fq "$source" scripts/build_macos_app.sh
          done
      - name: Build Xcode Debug configuration
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiDebug"
          CODE_SIGNING_ALLOWED=NO build
      - name: Build explicit Debug native overlay preview
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiOverlayPreview"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_OVERLAY'
          build
      - name: Build explicit Debug native translation domain
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiTranslationDomain"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN'
          build
      - name: Build Debug Result Lab flag without prerequisites
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiResultLabOnly"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_RESULT_LAB'
          build
      - name: Build Debug domain and overlay without Result Lab flag
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiResultLabMissingFlag"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_TRANSLATION_OVERLAY'
          build
      - name: Build exact Debug native translation Result Lab
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiTranslationResultLab"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_TRANSLATION_OVERLAY JUYI_NATIVE_TRANSLATION_RESULT_LAB'
          build
      - name: Reject Debug Result Lab mixed with live adapters
        run: |
          if xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiResultLabMixedApple" CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_TRANSLATION_OVERLAY JUYI_NATIVE_TRANSLATION_RESULT_LAB JUYI_NATIVE_APPLE_TRANSLATION_ADAPTER' build; then
            exit 1
          fi
          if xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiResultLabMixedVolc" CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_TRANSLATION_OVERLAY JUYI_NATIVE_TRANSLATION_RESULT_LAB JUYI_NATIVE_VOLC_TRANSLATION_ADAPTER' build; then
            exit 1
          fi
      - name: Build exact Debug real Apple Result Lab binding
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiAppleResultLabBinding"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_TRANSLATION_OVERLAY JUYI_NATIVE_TRANSLATION_RESULT_LAB JUYI_NATIVE_APPLE_TRANSLATION_ADAPTER JUYI_NATIVE_APPLE_RESULT_LAB_BINDING'
          build
      - name: Reject incomplete or mixed real Apple Result Lab binding
        run: |
          conditions=(
            'DEBUG JUYI_NATIVE_TRANSLATION_OVERLAY JUYI_NATIVE_TRANSLATION_RESULT_LAB JUYI_NATIVE_APPLE_TRANSLATION_ADAPTER JUYI_NATIVE_APPLE_RESULT_LAB_BINDING'
            'DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_TRANSLATION_RESULT_LAB JUYI_NATIVE_APPLE_TRANSLATION_ADAPTER JUYI_NATIVE_APPLE_RESULT_LAB_BINDING'
            'DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_TRANSLATION_OVERLAY JUYI_NATIVE_APPLE_TRANSLATION_ADAPTER JUYI_NATIVE_APPLE_RESULT_LAB_BINDING'
            'DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_TRANSLATION_OVERLAY JUYI_NATIVE_TRANSLATION_RESULT_LAB JUYI_NATIVE_APPLE_RESULT_LAB_BINDING'
            'DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_TRANSLATION_OVERLAY JUYI_NATIVE_TRANSLATION_RESULT_LAB JUYI_NATIVE_APPLE_TRANSLATION_ADAPTER JUYI_NATIVE_VOLC_TRANSLATION_ADAPTER JUYI_NATIVE_APPLE_RESULT_LAB_BINDING'
          )
          index=0
          for condition in "${conditions[@]}"; do
            if xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiAppleResultLabBindingRejected$index" CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS="$condition" build; then
              exit 1
            fi
            index=$((index + 1))
          done
      - name: Build explicit Debug native Apple Translation adapter
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiAppleTranslationAdapter"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_APPLE_TRANSLATION_ADAPTER'
          build
      - name: Build explicit Debug native Volc Translation adapter
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/JuyiVolcTranslationAdapter"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_VOLC_TRANSLATION_ADAPTER'
          build
      - name: Build Xcode Release configuration
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Release -derivedDataPath "$RUNNER_TEMP/JuyiRelease"
          CODE_SIGNING_ALLOWED=NO build
      - name: Build Release with overlay flag injected
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Release -derivedDataPath "$RUNNER_TEMP/JuyiReleaseOverlayFlag"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='JUYI_NATIVE_TRANSLATION_OVERLAY'
          build
      - name: Build Release with translation-domain flag injected
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Release -derivedDataPath "$RUNNER_TEMP/JuyiReleaseTranslationDomainFlag"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='JUYI_NATIVE_TRANSLATION_DOMAIN'
          build
      - name: Build Release with Apple adapter flags injected
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Release -derivedDataPath "$RUNNER_TEMP/JuyiReleaseAppleAdapterFlags"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_APPLE_TRANSLATION_ADAPTER'
          build
      - name: Build Release with every native development flag injected
        run: >-
          xcodebuild -quiet -project Juyi.xcodeproj -scheme Juyi
          -configuration Release -derivedDataPath "$RUNNER_TEMP/JuyiReleaseAllDevelopmentFlags"
          CODE_SIGNING_ALLOWED=NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS='JUYI_NATIVE_TRANSLATION_DOMAIN JUYI_NATIVE_APPLE_TRANSLATION_ADAPTER JUYI_NATIVE_VOLC_TRANSLATION_ADAPTER JUYI_NATIVE_TRANSLATION_OVERLAY JUYI_NATIVE_TRANSLATION_RESULT_LAB JUYI_NATIVE_APPLE_RESULT_LAB_BINDING'
          build
      - name: Verify overlay compile-time gate
        run: |
          find "$RUNNER_TEMP/JuyiOverlayPreview/Build/Products/Debug/Juyi.app/Contents/MacOS" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/overlay-preview.strings"
          find "$RUNNER_TEMP/JuyiDebug/Build/Products/Debug/Juyi.app/Contents/MacOS" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/overlay-default-debug.strings"
          find "$RUNNER_TEMP/JuyiRelease/Build/Products/Release/Juyi.app/Contents/MacOS" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/overlay-release.strings"
          find "$RUNNER_TEMP/JuyiReleaseOverlayFlag/Build/Products/Release/Juyi.app/Contents/MacOS" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/overlay-release-flag.strings"
          grep -Fq 'NativeTranslationOverlayController' "$RUNNER_TEMP/overlay-preview.strings"
          grep -Fq 'juyi-native-overlay-fixed-fixture-v1' "$RUNNER_TEMP/overlay-preview.strings"
          if grep -Fq 'NativeTranslationOverlayController' "$RUNNER_TEMP/overlay-default-debug.strings"; then exit 1; fi
          if grep -Fq 'NativeTranslationOverlayController' "$RUNNER_TEMP/overlay-release.strings"; then exit 1; fi
          if grep -Fq 'NativeTranslationOverlayController' "$RUNNER_TEMP/overlay-release-flag.strings"; then exit 1; fi
          if grep -Fq 'juyi-native-overlay-fixed-fixture-v1' "$RUNNER_TEMP/overlay-release-flag.strings"; then exit 1; fi
      - name: Verify native translation domain compile-time gate
        run: |
          find "$RUNNER_TEMP/JuyiTranslationDomain/Build/Products/Debug/Juyi.app/Contents/MacOS" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/domain-opt-in-debug.strings"
          find "$RUNNER_TEMP/JuyiDebug/Build/Products/Debug/Juyi.app/Contents/MacOS" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/domain-default-debug.strings"
          find "$RUNNER_TEMP/JuyiRelease/Build/Products/Release/Juyi.app/Contents/MacOS" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/domain-release.strings"
          find "$RUNNER_TEMP/JuyiReleaseTranslationDomainFlag/Build/Products/Release/Juyi.app/Contents/MacOS" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/domain-release-flag.strings"
          grep -Fq 'juyi-native-translation-domain-v1' "$RUNNER_TEMP/domain-opt-in-debug.strings"
          grep -Fq 'translate.volcengineapi.com' "$RUNNER_TEMP/domain-opt-in-debug.strings"
          grep -Fq 'VolcV4RequestBuilder' "$RUNNER_TEMP/domain-opt-in-debug.strings"
          grep -Fq 'VolcTranslationResponseParser' "$RUNNER_TEMP/domain-opt-in-debug.strings"
          for artifact in domain-default-debug domain-release domain-release-flag; do
            if grep -Fq 'juyi-native-translation-domain-v1' "$RUNNER_TEMP/$artifact.strings"; then exit 1; fi
            if grep -Fq 'translate.volcengineapi.com' "$RUNNER_TEMP/$artifact.strings"; then exit 1; fi
            if grep -Fq 'VolcV4RequestBuilder' "$RUNNER_TEMP/$artifact.strings"; then exit 1; fi
            if grep -Fq 'VolcTranslationResponseParser' "$RUNNER_TEMP/$artifact.strings"; then exit 1; fi
          done
      - name: Verify native translation Result Lab compile-time gate
        run: |
          opt_in_dir="$RUNNER_TEMP/JuyiTranslationResultLab/Build/Products/Debug/Juyi.app/Contents/MacOS"
          default_debug_dir="$RUNNER_TEMP/JuyiDebug/Build/Products/Debug/Juyi.app/Contents/MacOS"
          overlay_only_dir="$RUNNER_TEMP/JuyiOverlayPreview/Build/Products/Debug/Juyi.app/Contents/MacOS"
          domain_only_dir="$RUNNER_TEMP/JuyiTranslationDomain/Build/Products/Debug/Juyi.app/Contents/MacOS"
          result_only_dir="$RUNNER_TEMP/JuyiResultLabOnly/Build/Products/Debug/Juyi.app/Contents/MacOS"
          missing_flag_dir="$RUNNER_TEMP/JuyiResultLabMissingFlag/Build/Products/Debug/Juyi.app/Contents/MacOS"
          release_all_dir="$RUNNER_TEMP/JuyiReleaseAllDevelopmentFlags/Build/Products/Release/Juyi.app/Contents/MacOS"
          for token in 'juyi-native-translation-result-lab-v1' 'NativeTranslationResultLabCoordinator' 'Debug 固定样例 · 模拟执行' '开发：结果界面实验室…' 'The weather is pleasant today.' 'Good tools should feel effortless.'; do
            LC_ALL=C grep -aFq "$token" "$opt_in_dir"/*
          done
          for directory in "$default_debug_dir" "$overlay_only_dir" "$domain_only_dir" "$result_only_dir" "$missing_flag_dir" "$release_all_dir"; do
            for token in 'juyi-native-translation-result-lab-v1' 'NativeTranslationResultLabCoordinator' 'Debug 固定样例 · 模拟执行' '开发：结果界面实验室…'; do
              if LC_ALL=C grep -aFq "$token" "$directory"/*; then exit 1; fi
            done
          done
          for token in 'juyi-native-apple-translation-adapter-v1' '开发：测试 Apple 离线翻译…' 'juyi-native-volc-translation-adapter-v1' 'NativeVolcDebugWorkflow' 'io.github.Eim-aa.Juyi.debug.native-volc.active' '开发：测试火山云端翻译…'; do
            if LC_ALL=C grep -aFq "$token" "$opt_in_dir"/*; then exit 1; fi
          done
          find "$opt_in_dir" -maxdepth 1 -type f -exec otool -L {} + > "$RUNNER_TEMP/result-lab-opt-in.loads"
          for framework in '/Translation.framework/' '/_Translation_SwiftUI.framework/' '/Security.framework/' '/LocalAuthentication.framework/'; do
            if grep -Fq "$framework" "$RUNNER_TEMP/result-lab-opt-in.loads"; then exit 1; fi
          done
      - name: Verify real Apple Result Lab binding compile-time gate
        run: |
          opt_in_dir="$RUNNER_TEMP/JuyiAppleResultLabBinding/Build/Products/Debug/Juyi.app/Contents/MacOS"
          default_debug_dir="$RUNNER_TEMP/JuyiDebug/Build/Products/Debug/Juyi.app/Contents/MacOS"
          simulated_dir="$RUNNER_TEMP/JuyiTranslationResultLab/Build/Products/Debug/Juyi.app/Contents/MacOS"
          release_all_dir="$RUNNER_TEMP/JuyiReleaseAllDevelopmentFlags/Build/Products/Release/Juyi.app/Contents/MacOS"
          for token in 'juyi-native-apple-result-lab-binding-v1' 'NativeTranslationAppleResultLabCoordinator' '开发：真实 Apple 结果实验室…' '正在运行真实 Apple Translation…' 'Apple Translation 真实译文' 'The weather is pleasant today.'; do
            LC_ALL=C grep -aFq "$token" "$opt_in_dir"/*
          done
          for token in 'juyi-native-translation-result-lab-v1' 'NativeTranslationResultLabCoordinator' 'Debug 固定样例 · 模拟执行' '开发：结果界面实验室…' 'juyi-native-overlay-fixed-fixture-v1' '开发：预览下一状态：' '这是固定的火山云端成功预览译文。' '这是固定的火山转 Apple 离线预览译文。' 'juyi-native-apple-translation-adapter-v1' 'NativeAppleTranslationAdapterCoordinator' '开发：测试 Apple 离线翻译…' 'juyi-native-volc-translation-adapter-v1' 'NativeVolcDebugWorkflow' 'NativeVolcTranslationAdapterSheet' 'Library/Application Support/io.github.Eim-aa.Juyi/NativeVolcDebug' 'io.github.Eim-aa.Juyi.debug.native-volc.active' '此页面连接真实火山翻译 API，不是模拟器。' '开发：测试火山云端翻译…'; do
            if LC_ALL=C grep -aFq "$token" "$opt_in_dir"/*; then exit 1; fi
          done
          find "$opt_in_dir" -maxdepth 1 -type f -exec otool -L {} + > "$RUNNER_TEMP/apple-result-lab-binding.loads"
          grep -Fq '/Translation.framework/' "$RUNNER_TEMP/apple-result-lab-binding.loads"
          grep -Fq '/_Translation_SwiftUI.framework/' "$RUNNER_TEMP/apple-result-lab-binding.loads"
          for framework in '/Security.framework/' '/LocalAuthentication.framework/'; do
            if grep -Fq "$framework" "$RUNNER_TEMP/apple-result-lab-binding.loads"; then exit 1; fi
          done
          for directory in "$default_debug_dir" "$simulated_dir" "$release_all_dir"; do
            for token in 'juyi-native-apple-result-lab-binding-v1' '开发：真实 Apple 结果实验室…' '正在运行真实 Apple Translation…'; do
              if LC_ALL=C grep -aFq "$token" "$directory"/*; then exit 1; fi
            done
          done
          find "$release_all_dir" -maxdepth 1 -type f -exec otool -L {} + > "$RUNNER_TEMP/apple-result-lab-binding-release.loads"
          for framework in '/Translation.framework/' '/_Translation_SwiftUI.framework/' '/Security.framework/' '/LocalAuthentication.framework/'; do
            if grep -Fq "$framework" "$RUNNER_TEMP/apple-result-lab-binding-release.loads"; then exit 1; fi
          done
      - name: Verify native Apple Translation adapter compile-time gate
        run: |
          opt_in_dir="$RUNNER_TEMP/JuyiAppleTranslationAdapter/Build/Products/Debug/Juyi.app/Contents/MacOS"
          default_debug_dir="$RUNNER_TEMP/JuyiDebug/Build/Products/Debug/Juyi.app/Contents/MacOS"
          domain_only_dir="$RUNNER_TEMP/JuyiTranslationDomain/Build/Products/Debug/Juyi.app/Contents/MacOS"
          release_dir="$RUNNER_TEMP/JuyiRelease/Build/Products/Release/Juyi.app/Contents/MacOS"
          release_flags_dir="$RUNNER_TEMP/JuyiReleaseAppleAdapterFlags/Build/Products/Release/Juyi.app/Contents/MacOS"
          find "$opt_in_dir" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/apple-adapter-opt-in-debug.strings"
          find "$default_debug_dir" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/apple-adapter-default-debug.strings"
          find "$domain_only_dir" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/apple-adapter-domain-only-debug.strings"
          find "$release_dir" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/apple-adapter-release.strings"
          find "$release_flags_dir" -maxdepth 1 -type f -exec strings {} + > "$RUNNER_TEMP/apple-adapter-release-flags.strings"
          grep -Fq 'juyi-native-apple-translation-adapter-v1' "$RUNNER_TEMP/apple-adapter-opt-in-debug.strings"
          grep -Fq 'The weather is pleasant today.' "$RUNNER_TEMP/apple-adapter-opt-in-debug.strings"
          grep -Fq 'NativeAppleTranslationAdapterCoordinator' "$RUNNER_TEMP/apple-adapter-opt-in-debug.strings"
          LC_ALL=C grep -aFq '开发：测试 Apple 离线翻译…' "$opt_in_dir"/*
          find "$opt_in_dir" -maxdepth 1 -type f -exec otool -L {} + > "$RUNNER_TEMP/apple-adapter-opt-in-debug.loads"
          grep -Fq '/Translation.framework/' "$RUNNER_TEMP/apple-adapter-opt-in-debug.loads"
          for artifact in apple-adapter-default-debug apple-adapter-domain-only-debug apple-adapter-release apple-adapter-release-flags; do
            if grep -Fq 'juyi-native-apple-translation-adapter-v1' "$RUNNER_TEMP/$artifact.strings"; then exit 1; fi
            if grep -Fq 'The weather is pleasant today.' "$RUNNER_TEMP/$artifact.strings"; then exit 1; fi
            if grep -Fq 'NativeAppleTranslationAdapterCoordinator' "$RUNNER_TEMP/$artifact.strings"; then exit 1; fi
          done
          for directory in "$default_debug_dir" "$domain_only_dir" "$release_dir" "$release_flags_dir"; do
            if LC_ALL=C grep -aFq '开发：测试 Apple 离线翻译…' "$directory"/*; then exit 1; fi
            find "$directory" -maxdepth 1 -type f -exec otool -L {} + > "$RUNNER_TEMP/apple-adapter-off.loads"
            if grep -Fq '/Translation.framework/' "$RUNNER_TEMP/apple-adapter-off.loads"; then exit 1; fi
            if grep -Fq '/_Translation_SwiftUI.framework/' "$RUNNER_TEMP/apple-adapter-off.loads"; then exit 1; fi
          done
      - name: Verify native Volc Translation adapter compile-time gate
        run: |
          opt_in_dir="$RUNNER_TEMP/JuyiVolcTranslationAdapter/Build/Products/Debug/Juyi.app/Contents/MacOS"
          default_debug_dir="$RUNNER_TEMP/JuyiDebug/Build/Products/Debug/Juyi.app/Contents/MacOS"
          domain_only_dir="$RUNNER_TEMP/JuyiTranslationDomain/Build/Products/Debug/Juyi.app/Contents/MacOS"
          apple_only_dir="$RUNNER_TEMP/JuyiAppleTranslationAdapter/Build/Products/Debug/Juyi.app/Contents/MacOS"
          release_dir="$RUNNER_TEMP/JuyiRelease/Build/Products/Release/Juyi.app/Contents/MacOS"
          release_flags_dir="$RUNNER_TEMP/JuyiReleaseAllDevelopmentFlags/Build/Products/Release/Juyi.app/Contents/MacOS"
          LC_ALL=C grep -aFq 'juyi-native-volc-translation-adapter-v1' "$opt_in_dir"/*
          LC_ALL=C grep -aFq 'Good tools should feel effortless.' "$opt_in_dir"/*
          LC_ALL=C grep -aFq 'io.github.Eim-aa.Juyi.debug.native-volc.active' "$opt_in_dir"/*
          LC_ALL=C grep -aFq 'Library/Application Support/io.github.Eim-aa.Juyi/NativeVolcDebug' "$opt_in_dir"/*
          LC_ALL=C grep -aFq 'NativeVolcDebugWorkflow' "$opt_in_dir"/*
          LC_ALL=C grep -aFq 'NativeVolcTranslationAdapterSheet' "$opt_in_dir"/*
          LC_ALL=C grep -aFq '此页面连接真实火山翻译 API，不是模拟器。' "$opt_in_dir"/*
          LC_ALL=C grep -aFq '开发：测试火山云端翻译…' "$opt_in_dir"/*
          find "$opt_in_dir" -maxdepth 1 -type f -exec otool -L {} + > "$RUNNER_TEMP/volc-adapter-opt-in-debug.loads"
          grep -Fq '/Security.framework/' "$RUNNER_TEMP/volc-adapter-opt-in-debug.loads"
          grep -Fq '/LocalAuthentication.framework/' "$RUNNER_TEMP/volc-adapter-opt-in-debug.loads"
          for directory in "$default_debug_dir" "$domain_only_dir" "$apple_only_dir" "$release_dir" "$release_flags_dir"; do
            if LC_ALL=C grep -aFq 'juyi-native-volc-translation-adapter-v1' "$directory"/*; then exit 1; fi
            if LC_ALL=C grep -aFq 'io.github.Eim-aa.Juyi.debug.native-volc.active' "$directory"/*; then exit 1; fi
            if LC_ALL=C grep -aFq 'Library/Application Support/io.github.Eim-aa.Juyi/NativeVolcDebug' "$directory"/*; then exit 1; fi
            if LC_ALL=C grep -aFq 'NativeVolcDebugWorkflow' "$directory"/*; then exit 1; fi
            if LC_ALL=C grep -aFq 'NativeVolcTranslationAdapterSheet' "$directory"/*; then exit 1; fi
            if LC_ALL=C grep -aFq '此页面连接真实火山翻译 API，不是模拟器。' "$directory"/*; then exit 1; fi
