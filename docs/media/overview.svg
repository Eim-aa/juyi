<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">句译：选中英文，连按两次 Option，在选区旁看中文</title>
  <desc id="desc">三步操作示意，非实机录屏。macOS 15 及以上，英语译为简体中文。本地翻译由 Apple 提供，当前为开发者预览。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f3eb"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="78" font-size="27" font-weight="700" fill="#193458">句译 <tspan font-size="19" font-weight="400" fill="#627186">/ JUYI</tspan></text>
    <rect x="948" y="43" width="188" height="42" rx="21" fill="#ffffff"/>
    <circle cx="972" cy="64" r="5" fill="#4068e8"/>
    <text x="989" y="71" font-size="17" fill="#344763">开发者预览</text>
    <text x="64" y="176" font-size="60" font-weight="700" letter-spacing="-2" fill="#152c4d">读懂这一句，</text>
    <text x="64" y="249" font-size="60" font-weight="700" letter-spacing="-2" fill="#315edf">继续读下去。</text>
    <text x="66" y="301" font-size="23" fill="#55677e">选中英文，连按两次 Option。中文译文出现在选区旁。</text>
    <g transform="translate(64 348)">
      <rect width="334" height="240" rx="20" fill="#ffffff"/>
      <text x="26" y="43" font-size="15" font-weight="700" fill="#315edf">01 / SELECT</text>
      <rect x="26" y="73" width="282" height="43" rx="7" fill="#dce8ff"/>
      <text x="39" y="101" font-size="20" fill="#193458">Good tools feel effortless.</text>
      <text x="26" y="167" font-size="25" font-weight="600" fill="#152c4d">选中英文</text>
      <text x="26" y="202" font-size="17" fill="#627186">在支持的 App 中选择文字</text>
    </g>
    <g transform="translate(433 348)">
      <rect width="334" height="240" rx="20" fill="#ffffff"/>
      <text x="26" y="43" font-size="15" font-weight="700" fill="#315edf">02 / DOUBLE TAP</text>
      <rect x="26" y="67" width="78" height="61" rx="12" fill="#f0f4fd" stroke="#dce4f1"/>
      <rect x="119" y="67" width="78" height="61" rx="12" fill="#f0f4fd" stroke="#dce4f1"/>
      <path d="M45 84h12l16 27h13 M73 84h13 M138 84h12l16 27h13 M166 84h13" fill="none" stroke="#315edf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="167" font-size="25" font-weight="600" fill="#152c4d">连按两次 Option</text>
      <text x="26" y="202" font-size="17" fill="#627186">不用切换到翻译窗口</text>
    </g>
    <g transform="translate(802 348)">
      <rect width="334" height="240" rx="20" fill="#315edf"/>
      <text x="26" y="43" font-size="15" font-weight="700" fill="#dce8ff">03 / KEEP READING</text>
      <text x="26" y="115" font-size="34" font-weight="600" fill="#ffffff">中文，就在旁边。</text>
      <text x="26" y="167" font-size="25" font-weight="600" fill="#ffffff">看译文，继续阅读</text>
      <text x="26" y="202" font-size="17" fill="#e1e9ff">默认由 Apple 在本机翻译</text>
    </g>
    <text x="66" y="636" font-size="18" fill="#435976">macOS 15+ · 英语 → 简体中文 · MIT 开源</text>
    <text x="66" y="670" font-size="15" fill="#627186">当前预览仍需 Hammerspoon、辅助功能授权与系统语言资源。</text>
    <text x="1136" y="667" text-anchor="end" font-size="15" fill="#627186">操作示意 · 非实机录屏</text>
  </g>
</svg>
